name: Verify harness
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OFFLOAD_SKIP_ENV: "1"
      LANGSMITH_TRACING: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          SLEEP_PROTOTYPE_BROWSER: chromium
      - run: npm run build
      - run: npm run test:e2e
        env:
          PW_CHANNEL: chromium
          PW_START_SERVER: "1"
          PW_BASE_URL: http://127.0.0.1:5394
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          retention-days: 3
